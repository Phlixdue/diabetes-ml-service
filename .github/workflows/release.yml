name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: MODEL_VERSION=${{ env.TAG_NAME }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
            ghcr.io/${{ github.repository }}:latest

      - name: Install dependencies for smoke test
        run: pip install requests

      - name: Run container smoke test
        run: |
          docker run -d -p 8000:8000 --name test-container ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
          sleep 10
          python scripts/smoke_test.py
        env:
          MODEL_VERSION: ${{ env.TAG_NAME }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/train.py --version ${{ env.TAG_NAME }}
          gh release create ${{ env.TAG_NAME }} \
            --title "Release ${{ env.TAG_NAME }}" \
            --notes "Automated release of model version ${{ env.TAG_NAME }}." \
            models/metrics-${{ env.TAG_NAME }}.json